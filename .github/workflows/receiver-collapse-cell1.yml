name: Receiver collapse cell1 baseline

on:
  push:
    branches: [main]
    paths:
      - 'receiver_collapse_cell1.py'
      - '.github/workflows/receiver-collapse-cell1.yml'
  workflow_dispatch:

jobs:
  receiver-collapse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas neuron

      - name: Fetch author FCI repository
        run: |
          git clone --depth 1 https://github.com/ido4848/FCI.git FCI

      - name: Compile released Hay mechanisms
        working-directory: FCI/simulating_neurons/neuron_models/rat/hay/Rat_L5b_PC_2_Hay_passive_dends_simple_soma
        run: |
          nrnivmodl mods

      - name: Run receiver-collapse baseline
        run: |
          python receiver_collapse_cell1.py \
            --fci-root FCI \
            --sources-per-tree 8 \
            --output /tmp/receiver_collapse_cell1_result.json \
            | tee /tmp/receiver_collapse_cell1.log

      - uses: actions/upload-artifact@v4
        with:
          name: receiver-collapse-cell1
          path: |
            /tmp/receiver_collapse_cell1_result.json
            /tmp/receiver_collapse_cell1.log
          retention-days: 14
