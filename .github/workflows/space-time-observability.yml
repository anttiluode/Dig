name: Space time observability

on:
  push:
    branches: [main]
    paths:
      - 'space_time_observability_cell1.py'
      - 'SPACE_TIME_OBSERVABILITY_GATE.md'
      - '.github/workflows/space-time-observability.yml'
  workflow_dispatch:

jobs:
  space-time:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas neuron matplotlib

      - name: Fetch exact FCI commit
        run: |
          git clone https://github.com/ido4848/FCI.git FCI
          cd FCI
          git checkout 55826436751c03a32dfd39e91a48894869e1db57
          test "$(git rev-parse HEAD)" = "55826436751c03a32dfd39e91a48894869e1db57"

      - name: Compile released FCI Hay mechanisms
        working-directory: FCI/simulating_neurons/neuron_models/rat/hay/Rat_L5b_PC_2_Hay_passive_dends_simple_soma
        run: |
          nrnivmodl mods

      - name: Run preregistered space-time gate
        shell: bash
        run: |
          set -euo pipefail
          # One extra dt step only ensures NEURON records the sample at
          # source-relative t=120.00 ms. The analysis still truncates at 120 ms.
          python space_time_observability_cell1.py \
            --fci-root FCI \
            --tstop-ms 140.05 \
            --output /tmp/space_time_observability_cell1_result.json \
            | tee /tmp/space_time_observability_cell1.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-time-observability
          path: |
            /tmp/space_time_observability_cell1_result.json
            /tmp/space_time_observability_cell1.log
          if-no-files-found: warn
          retention-days: 14
